<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a7"/>
    </marker>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A23B"/>
    </marker>
    <style>
      .card { fill: #1f2430; stroke: #343b4a; stroke-width: 1; }
      .sel  { stroke: #5B8DEF; stroke-width: 2; }
      .t    { fill: #e6e9ef; font-size: 13px; font-weight: 600; }
      .id   { fill: #8b95a7; font-size: 10.5px; }
      .k    { fill: #8b95a7; font-size: 10.5px; }
      .v    { fill: #e6e9ef; font-size: 10.5px; text-anchor: end; }
      .chip { font-size: 8.5px; font-weight: 700; letter-spacing: .6px; }
      .lane { fill: #8b95a7; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .note { fill: #b8c0cc; font-size: 11.5px; }
      .h    { fill: #e6e9ef; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1240" height="600" fill="#151922"/>
  <text x="24" y="32" class="h">Draft: chain in lanes, colour-coded groups (not code yet)</text>
  <text x="24" y="52" class="note">Main line = signal path (Input → preprocessing → signal outputs). Feature extraction forks off the main line (↘) into its own lane, with its outputs.</text>

  <!-- lane labels -->
  <text x="24" y="92" class="lane">MAIN LINE · SIGNAL</text>
  <text x="24" y="372" class="lane">FEATURE LANE · FORKED</text>

  <!-- main line rail -->
  <line x1="170" y1="190" x2="1060" y2="190" stroke="#8b95a7" stroke-width="2"/>

  <!-- ===== Input ===== -->
  <g transform="translate(24,104)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#8b95a7"/>
    <text x="10" y="22" class="chip" fill="#8b95a7">■ INPUT</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">Synthetic</text>
    <text x="10" y="58" class="id">input · LIVE</text>
    <text x="10" y="82" class="k">channels</text><text x="136" y="82" class="v">16</text>
    <text x="10" y="98" class="k">rate</text><text x="136" y="98" class="v">500 Hz</text>
    <rect x="10" y="140" width="126" height="24" rx="5" fill="#2a3040" stroke="#343b4a"/>
    <text x="73" y="156" class="id" text-anchor="middle" fill="#e6e9ef">Recording…</text>
  </g>

  <!-- tap -->
  <rect x="181" y="183" width="12" height="12" transform="rotate(45 187 189)" fill="none" stroke="#8b95a7" stroke-width="1.5"/>

  <!-- ===== Preprocessing cards ===== -->
  <!-- High-pass -->
  <g transform="translate(206,104)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#5B8DEF"/>
    <text x="10" y="22" class="chip" fill="#5B8DEF">● PREPROCESS</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">High-pass</text>
    <text x="10" y="58" class="id">hp1 · causal</text>
    <text x="10" y="82" class="k">low</text><text x="136" y="82" class="v">1 Hz</text>
    <text x="10" y="98" class="k">order</text><text x="136" y="98" class="v">4</text>
  </g>
  <rect x="363" y="183" width="12" height="12" transform="rotate(45 369 189)" fill="none" stroke="#8b95a7" stroke-width="1.5"/>

  <!-- Notch -->
  <g transform="translate(388,104)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#5B8DEF"/>
    <text x="10" y="22" class="chip" fill="#5B8DEF">● PREPROCESS</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">Notch</text>
    <text x="10" y="58" class="id">notch1</text>
    <text x="10" y="82" class="k">freq</text><text x="136" y="82" class="v">50 Hz</text>
  </g>
  <rect x="545" y="183" width="12" height="12" transform="rotate(45 551 189)" fill="#5B8DEF" stroke="#5B8DEF" stroke-width="1.5"/>

  <!-- Re-reference -->
  <g transform="translate(570,104)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#5B8DEF"/>
    <text x="10" y="22" class="chip" fill="#5B8DEF">● PREPROCESS</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">Re-reference</text>
    <text x="10" y="58" class="id">car1</text>
    <text x="10" y="82" class="k">ref</text><text x="136" y="82" class="v">average</text>
  </g>
  <rect x="727" y="183" width="12" height="12" transform="rotate(45 733 189)" fill="none" stroke="#8b95a7" stroke-width="1.5"/>

  <!-- ICA -->
  <g transform="translate(752,104)">
    <rect class="card sel" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#5B8DEF"/>
    <text x="10" y="22" class="chip" fill="#5B8DEF">● PREPROCESS</text>
    <circle cx="134" cy="19" r="4" fill="#E8A23B"/>
    <text x="10" y="42" class="t">ICA + ICLabel</text>
    <text x="10" y="58" class="id">ica1 · calibrating 42/60 s</text>
    <text x="10" y="82" class="k">threshold</text><text x="136" y="82" class="v">0.8</text>
    <text x="10" y="98" class="k">eye / muscle</text><text x="136" y="98" class="v">✓ / ✓</text>
    <rect x="10" y="140" width="126" height="24" rx="5" fill="#2a3040" stroke="#343b4a"/>
    <text x="73" y="156" class="id" text-anchor="middle" fill="#e6e9ef">Calibrate</text>
  </g>
  <rect x="909" y="183" width="12" height="12" transform="rotate(45 915 189)" fill="none" stroke="#8b95a7" stroke-width="1.5"/>

  <!-- Output on main line -->
  <g transform="translate(934,104)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#2FB89A"/>
    <text x="10" y="22" class="chip" fill="#2FB89A">▶ OUTPUT</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">LSL out</text>
    <text x="10" y="58" class="id">lslout1 · signal</text>
    <text x="10" y="82" class="k">stream</text><text x="136" y="82" class="v">meegxer</text>
  </g>

  <!-- add strip on main line -->
  <g transform="translate(1096,104)">
    <rect width="120" height="176" rx="8" fill="none" stroke="#343b4a" stroke-dasharray="5 4"/>
    <text x="60" y="94" class="id" text-anchor="middle">+ Add strip</text>
  </g>

  <!-- ===== Fork (↘) from after Re-reference ===== -->
  <circle cx="733" cy="190" r="5" fill="#E8A23B"/>
  <path d="M733,195 L733,330 Q733,345 748,345 L800,345" fill="none" stroke="#E8A23B" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="742" y="300" class="id" fill="#E8A23B">fork: features</text>
  <text x="742" y="314" class="id" fill="#E8A23B">from car1</text>

  <!-- feature lane rail -->
  <line x1="958" y1="430" x2="990" y2="430" stroke="#E8A23B" stroke-width="2" marker-end="url(#arrowF)"/>

  <!-- Band power (feature) -->
  <g transform="translate(806,342)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#E8A23B"/>
    <text x="10" y="22" class="chip" fill="#E8A23B">◆ FEATURES</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">Band power</text>
    <text x="10" y="58" class="id">bp1 · 2 s windows</text>
    <text x="10" y="82" class="k">bands</text><text x="136" y="82" class="v">δ θ α β</text>
    <text x="10" y="98" class="k">relative</text><text x="136" y="98" class="v">yes</text>
  </g>

  <!-- feature output -->
  <g transform="translate(996,342)">
    <rect class="card" width="146" height="176" rx="8"/>
    <rect width="146" height="5" rx="2" fill="#2FB89A"/>
    <text x="10" y="22" class="chip" fill="#2FB89A">▶ OUTPUT</text>
    <circle cx="134" cy="19" r="4" fill="#3fbf7f"/>
    <text x="10" y="42" class="t">LSL features</text>
    <text x="10" y="58" class="id">lslfeat1 · features</text>
    <text x="10" y="82" class="k">stream</text><text x="136" y="82" class="v">bp</text>
  </g>

  <!-- a second fork, shown collapsed, to illustrate several -->
  <circle cx="551" cy="190" r="5" fill="#E8A23B"/>
  <path d="M551,195 L551,520 Q551,535 566,535 L600,535" fill="none" stroke="#E8A23B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowF)"/>
  <g transform="translate(606,520)">
    <rect width="176" height="30" rx="6" fill="#1f2430" stroke="#E8A23B" stroke-dasharray="4 3"/>
    <text x="10" y="19" class="id" fill="#e6e9ef">◆ PSD  ▸ Feature TSV   (folded)</text>
  </g>

  <!-- legend -->
  <g transform="translate(24,420)">
    <text x="0" y="0" class="lane">GROUPS (colour + shape + label, never colour alone)</text>
    <rect x="0" y="14" width="22" height="5" fill="#8b95a7"/><text x="30" y="20" class="note">■ Input · source</text>
    <rect x="0" y="34" width="22" height="5" fill="#5B8DEF"/><text x="30" y="40" class="note">● Preprocessing · signal → signal</text>
    <rect x="0" y="54" width="22" height="5" fill="#E8A23B"/><text x="30" y="60" class="note">◆ Feature extraction · signal → features</text>
    <rect x="0" y="74" width="22" height="5" fill="#2FB89A"/><text x="30" y="80" class="note">▶ Output · sinks (signal or features)</text>
    <rect x="2" y="94" width="10" height="10" transform="rotate(45 7 99)" fill="none" stroke="#8b95a7" stroke-width="1.5"/><text x="30" y="104" class="note">◇ tap (filled = Main)</text>
    <circle cx="7" cy="122" r="4" fill="#E8A23B"/><text x="30" y="126" class="note">fork point on the main line</text>
    <text x="0" y="152" class="id">Groups come from the node's role and ports:</text>
    <text x="0" y="166" class="id">no new manifest field, plugins are grouped too.</text>
  </g>
</svg>
