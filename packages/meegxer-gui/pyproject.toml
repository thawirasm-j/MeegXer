[project]
name = "meegxer-gui"
version = "0.0.0"
description = "PySide6 + pyqtgraph client for the MeegXer core daemon."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "meegxer-core",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meegxer.gui"

[tool.uv.sources]
meegxer-core = { workspace = true }
