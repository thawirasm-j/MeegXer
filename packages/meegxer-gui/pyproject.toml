[project]
name = "meegxer-gui"
version = "0.0.0"
description = "PySide6 + pyqtgraph client for the MeegXer core daemon."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["EEG", "BCI", "signal processing", "EEGLAB", "MNE", "LSL"]
authors = [
    { name = "Thawirasm Jungrungrueang" },
    { name = "TrimLAB, Prince of Songkla University" },
]
dependencies = [
    "meegxer-core",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
]

[project.scripts]
meegxer-gui = "meegxer.gui.app:main"

[project.urls]
Homepage = "https://github.com/thawirasm-j/MeegXer"
Documentation = "https://github.com/thawirasm-j/MeegXer/blob/main/docs/DESIGN.md"
Issues = "https://github.com/thawirasm-j/MeegXer/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meegxer.gui"

[tool.uv.sources]
meegxer-core = { workspace = true }
