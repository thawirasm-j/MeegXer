[project]
name = "meegxer"
version = "0.0.0"
description = "MeegXer, a user-friendly mixer for EEG processing: live and offline pipelines with built-in nodes and plugins (core, nodes, plugins, GUI and CLI)."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["EEG", "BCI", "signal processing", "EEGLAB", "MNE", "LSL"]
authors = [
    { name = "Thawirasm Jungrungrueang" },
    { name = "TrimLAB, Prince of Songkla University" },
]
dependencies = [
    "meegxer-core",
    "meegxer-nodes",
    "meegxer-plugins",
    "meegxer-gui",
    "meegxer-cli",
]

# The commands of the packages it installs, so that `uv tool install meegxer` puts
# them on PATH (uv exposes only the commands of the package named).
[project.scripts]
meegxer = "meegxer.cli:app"
meegxer-gui = "meegxer.gui.app:main"
meegxer-daemon = "meegxer.core.daemon:main"
meegxer-plugin = "meegxer.plugins.cli:main"

[project.urls]
Homepage = "https://github.com/thawirasm-j/MeegXer"
Documentation = "https://github.com/thawirasm-j/MeegXer/blob/main/docs/DESIGN.md"
Issues = "https://github.com/thawirasm-j/MeegXer/issues"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meegxer.bundle"

[tool.uv.sources]
meegxer-core = { workspace = true }
meegxer-nodes = { workspace = true }
meegxer-plugins = { workspace = true }
meegxer-gui = { workspace = true }
meegxer-cli = { workspace = true }
