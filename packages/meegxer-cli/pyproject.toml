[project]
name = "meegxer-cli"
version = "0.0.0"
description = "Command-line interface: headless runs, batch jobs, Pi deployment."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["EEG", "BCI", "signal processing", "EEGLAB", "MNE", "LSL"]
authors = [
    { name = "Thawirasm Jungrungrueang" },
    { name = "TrimLAB, Prince of Songkla University" },
]
dependencies = [
    "meegxer-core",
    "meegxer-sterile",
    "typer>=0.12",
]

[project.scripts]
meegxer = "meegxer.cli:app"

[project.urls]
Homepage = "https://github.com/thawirasm-j/MeegXer"
Documentation = "https://github.com/thawirasm-j/MeegXer/blob/main/docs/DESIGN.md"
Issues = "https://github.com/thawirasm-j/MeegXer/issues"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meegxer.cli"

[tool.uv.sources]
meegxer-core = { workspace = true }
meegxer-sterile = { workspace = true }
