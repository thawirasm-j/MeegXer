[project]
name = "meegxer-core"
version = "0.0.0"
description = "Headless engine: graph, schedulers, plugin spec, I/O and control API (no GUI)."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["EEG", "BCI", "signal processing", "EEGLAB", "MNE", "LSL"]
authors = [
    { name = "Thawirasm Jungrungrueang" },
    { name = "TrimLAB, Prince of Songkla University" },
]
dependencies = [
    "edfio>=0.4",
    "eeglabio>=0.0.3",
    "jsonschema>=4.23",
    "mne>=1.8",
    "mne-bids>=0.16",
    "numpy>=2.1",
    "pylsl>=1.16",
    "pyzmq>=26",
    "scipy>=1.14.1",
]

[project.entry-points."meegxer.nodes"]
"meegxer.core.synthetic" = "meegxer.core.sources:SyntheticSource"
"meegxer.core.file" = "meegxer.core.sources:FileSource"
"meegxer.core.bids" = "meegxer.core.sources:BidsSource"
"meegxer.core.probe" = "meegxer.core.probes:MemoryProbe"
"meegxer.core.set_writer" = "meegxer.core.sinks:SetSink"
"meegxer.core.edf_writer" = "meegxer.core.sinks:EdfSink"
"meegxer.core.feature_tsv" = "meegxer.core.sinks:FeatureTsvSink"
"meegxer.core.bids_writer" = "meegxer.core.bids_out:BidsWriter"
"meegxer.core.bids_features" = "meegxer.core.bids_out:BidsFeatures"
"meegxer.core.lsl_in" = "meegxer.core.lsl:LslSource"
"meegxer.core.lsl_out" = "meegxer.core.lsl:LslSink"
"meegxer.core.lsl_features_out" = "meegxer.core.lsl:LslFeatureSink"

[project.scripts]
meegxer-daemon = "meegxer.core.daemon:main"

[project.urls]
Homepage = "https://github.com/thawirasm-j/MeegXer"
Documentation = "https://github.com/thawirasm-j/MeegXer/blob/main/docs/DESIGN.md"
Issues = "https://github.com/thawirasm-j/MeegXer/issues"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meegxer.core"
