# Virtual workspace root: not a package itself. Members live in packages/.
# Packages: core, nodes (built-ins), plugins, gui, cli, and the meegxer bundle.
[project]
name = "meegxer-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
meegxer-core = { workspace = true }
meegxer-nodes = { workspace = true }
meegxer-plugins = { workspace = true }
meegxer-gui = { workspace = true }
meegxer-cli = { workspace = true }
meegxer = { workspace = true }

[dependency-groups]
dev = [
    "meegxer-core",
    "meegxer-nodes",
    "meegxer-plugins",
    "meegxer-gui",
    "meegxer-cli",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-jsonschema",
    "scipy-stubs",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".smoke-venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["meegxer"]

[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/meegxer-core/src",
    "packages/meegxer-nodes/src",
    "packages/meegxer-plugins/src",
    "packages/meegxer-gui/src",
    "packages/meegxer-cli/src",
]
files = ["packages/*/src", "packages/*/tests", "tests", "tools"]
# mypy names every tests/conftest.py "conftest"; the runtime one is checked.
exclude = ["packages/meegxer-gui/tests/conftest\\.py$"]

[[tool.mypy.overrides]]
module = ["mne", "mne.*", "mne_bids", "mne_bids.*", "mne_icalabel", "mne_icalabel.*",
          "mne_connectivity", "mne_connectivity.*", "antropy", "antropy.*",
          "specparam", "specparam.*", "pylsl", "pylsl.*", "pyqtgraph", "pyqtgraph.*",
          "pyxdf", "pyxdf.*", "sklearn", "sklearn.*", "pynput", "pynput.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["meegxer.plugins._sdk"]  # verbatim copy of sdk/python/meegxer_plugin.py
ignore_errors = true

[[tool.mypy.overrides]]
module = ["meegxer.gui.signal_view"]
disallow_subclassing_any = false  # pyqtgraph ships no type information

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = ["--import-mode=importlib", "-ra"]
timeout = 120

# Architecture rules from CLAUDE.md, enforced on every CI run (lint-imports).
[tool.importlinter]
root_packages = [
    "meegxer.api",
    "meegxer.core",
    "meegxer.nodes",
    "meegxer.plugins",
    "meegxer.gui",
    "meegxer.cli",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Rule 1: core is headless (no GUI toolkit, no GUI, node or plugin package)"
type = "forbidden"
source_modules = ["meegxer.core", "meegxer.api"]  # the API ships with the core
forbidden_modules = [
    "meegxer.gui",
    "meegxer.plugins",
    "meegxer.nodes",
    "meegxer.cli",
    "PySide6",
    "PyQt5",
    "PyQt6",
    "pyqtgraph",
]

# Plugins (and the container engine) are optional extensions: everything else
# reaches them only through the node-provider entry point.
[[tool.importlinter.contracts]]
name = "Plugins load only through entry points (no direct plugin or Docker imports)"
type = "forbidden"
source_modules = ["meegxer.api", "meegxer.core", "meegxer.nodes", "meegxer.gui",
                  "meegxer.cli"]
forbidden_modules = ["meegxer.plugins", "docker"]

[[tool.importlinter.contracts]]
name = "Built-ins stay headless (no GUI toolkit in built-in nodes)"
type = "forbidden"
source_modules = ["meegxer.nodes"]
forbidden_modules = ["meegxer.gui", "meegxer.cli", "PySide6", "PyQt5", "PyQt6", "pyqtgraph"]
