name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code (CodeQL actions/missing-workflow-permissions);
# the token gets nothing more, as in security.yml and release.yml.
permissions:
  contents: read

jobs:
  lint:
    name: Lint, types, architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages --python 3.14
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - name: mypy as on Windows (platform-only names such as signal.SIGKILL)
        run: uv run --frozen mypy --platform win32
      - run: uv run --frozen lint-imports

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen  # GUI tests run headless
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --all-packages --python ${{ matrix.python }}
      - run: uv run --frozen pytest

  packaging:
    name: Release build (all packages, stamped version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: python3 tools/set_version.py 0.0.1.dev0  # as the release workflow does
      - run: uv build --all-packages --out-dir dist
      - run: uvx twine check --strict dist/*

  plugins:
    name: Reference plugins in the container sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build reference plugin images
        working-directory: packages/meegxer-plugins
        run: |
          docker build -f plugins/average_reference/Dockerfile -t meegxer/example-average-reference:0.1.0 .
          docker build -f plugins/octave_iir_bandpass/Dockerfile -t meegxer/example-octave-iir-bandpass:0.1.0 .
          docker build -f plugins/eeglab_asr/Dockerfile -t meegxer/eeglab-asr:0.1.0 .
      - run: uv sync --locked --all-packages --python 3.14
      - name: Conformance (protocol, acceptance test 1, restart) inside Docker
        run: |
          uv run --frozen meegxer-plugin check meegxer/example-average-reference:0.1.0
          uv run --frozen meegxer-plugin check meegxer/example-octave-iir-bandpass:0.1.0
          uv run --frozen meegxer-plugin check meegxer/eeglab-asr:0.1.0
      - run: uv run --frozen pytest packages/meegxer-plugins -k sandbox
        env:
          MEEGXER_TEST_IMAGES: meegxer/example-average-reference:0.1.0,meegxer/example-octave-iir-bandpass:0.1.0,meegxer/eeglab-asr:0.1.0

  deps-smoke:
    name: Dependency smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # ARM64 is informational until the Pi target is in scope (docs/WORKPLAN.md).
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        python: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      # pylsl bundles liblsl only for x86_64 Linux, macOS and Windows; on ARM64 the
      # pure-Python wheel needs a system liblsl (same as on a Raspberry Pi).
      - name: Build liblsl (ARM64)
        if: runner.arch == 'ARM64'
        run: |
          git clone --depth 1 --branch v1.17.7 https://github.com/sccn/liblsl.git "$RUNNER_TEMP/liblsl"
          cmake -S "$RUNNER_TEMP/liblsl" -B "$RUNNER_TEMP/liblsl-build" -DCMAKE_BUILD_TYPE=Release -DLSL_UNIXFOLDERS=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/liblsl-prefix"
          cmake --build "$RUNNER_TEMP/liblsl-build" -j
          cmake --install "$RUNNER_TEMP/liblsl-build"
          echo "PYLSL_LIB=$RUNNER_TEMP/liblsl-prefix/lib/liblsl.so" >> "$GITHUB_ENV"
      - run: uv run --no-project --python ${{ matrix.python }} python tools/smoke_deps.py --python ${{ matrix.python }} | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
