name: Security

# Supply-chain checks (docs/ROADMAP.md M9.4): known vulnerabilities in the locked
# dependencies (pip-audit against uv.lock), and CodeQL's code scanning. Weekly as
# well, because new advisories appear for dependencies that did not change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, after Dependabot's weekly run
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Locked dependencies of the shipped packages
        run: >
          uv export --frozen --all-packages --no-dev --no-emit-workspace
          --format requirements.txt --output-file requirements.txt
      - name: Audit them
        run: uvx pip-audit --disable-pip --require-hashes -r requirements.txt

  codeql:
    name: CodeQL (Python, Actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
