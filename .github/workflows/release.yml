name: Release

# Publishes all MeegXer packages with one shared version, taken from the git tag
# (v0.1.0a1 -> 0.1.0a1), through PyPI Trusted Publishing (no tokens stored).
#  - Pushing a v* tag builds and publishes to TestPyPI.
#  - Real PyPI: Actions -> Release -> "Run workflow", choose the tag as the ref and
#    target "pypi". The "pypi" environment should require a reviewer's approval.
# Each package is uploaded by its own job: one Trusted Publishing token exchange
# can turn only one pending publisher into a project, so a single upload of all
# six packages creates the first project and is refused for the rest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (run this from a v* tag)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run the release from a v* tag, not $GITHUB_REF_NAME"; exit 1
          fi
          python3 tools/set_version.py "$GITHUB_REF_NAME"
      - name: Build each package into dist/<package>/
        run: |
          for pyproject in packages/*/pyproject.toml; do
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$pyproject" | head -1)
            uv build --package "$name" --out-dir "dist/$name"
          done
      - name: Check the distributions
        run: |
          uvx twine check --strict dist/*/*
          test "$(ls dist/*/*.whl | wc -l)" -eq 6
          test "$(ls dist/*/*.tar.gz | wc -l)" -eq 6
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: TestPyPI (${{ matrix.package }})
    needs: build
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [meegxer-core, meegxer-nodes, meegxer-gui, meegxer-cli,
                  meegxer-plugins, meegxer]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/meegxer/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true  # a rerun completes a partly uploaded release

  pypi:
    name: PyPI (${{ matrix.package }})
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [meegxer-core, meegxer-nodes, meegxer-gui, meegxer-cli,
                  meegxer-plugins, meegxer]
    environment:
      name: pypi
      url: https://pypi.org/project/meegxer/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true  # a rerun completes a partly uploaded release
